# ==============================================================================
# 🌐 CLOUD-ARCH HIGH-PERFORMANCE NGINX REVERSE PROXY & WSS ROUTER
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. GitLab CE Router
server {
    listen 80;
    server_name gitlab.example.com; # Akan otomatis diganti oleh deploy.sh sesuai BASE_DOMAIN
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }
}

# 2. JupyterLab RTC & Yjs WebSockets Router
server {
    listen 80;
    server_name lab.example.com; # Akan otomatis diganti oleh deploy.sh sesuai BASE_DOMAIN
    client_max_body_size 500M;

    # Google Web OAuth 2.0 Callback Receiver for Antigravity Gateway (Port 8085)
    location /oauth2callback {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket WSS Support for Real-Time Collaboration (RTC) & Terminal
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Unbuffered streaming for zero-latency terminal typing
        proxy_buffering off;
        proxy_cache off;
    }
}

# 3. MLflow Tracking Server Router
server {
    listen 80;
    server_name mlflow.example.com; # Akan otomatis diganti oleh deploy.sh sesuai BASE_DOMAIN
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }
}
