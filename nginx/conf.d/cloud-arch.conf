# ==============================================================================
# 🌐 CLOUD-ARCH HIGH-PERFORMANCE NGINX REVERSE PROXY & WSS ROUTER
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 0. Drop Direct IP Access & Unrecognized Virtual Hosts (Security Hardening)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 1. GitLab CE Router
server {
    listen 80;
    server_name gitlab.example.com; # Akan otomatis diganti oleh deploy.sh sesuai BASE_DOMAIN
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 86400s;
    }
}

# 2. JupyterLab RTC & Yjs WebSockets Router
server {
    listen 80;
    server_name lab.example.com; # Akan otomatis diganti oleh deploy.sh sesuai BASE_DOMAIN
    client_max_body_size 500M;

    # Google Web OAuth 2.0 Callback Receiver for Antigravity Gateway (Port 8085)
    location /oauth2callback {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;

        # WebSocket WSS Support for Real-Time Collaboration (RTC) & Terminal
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Unbuffered streaming for zero-latency terminal typing
        proxy_buffering off;
        proxy_cache off;
    }
}

# 3. MLflow Tracking Server Router (Protected Origin)
server {
    listen 80;
    server_name mlflow.example.com; # Akan otomatis diganti oleh deploy.sh sesuai BASE_DOMAIN
    client_max_body_size 200M;

    # P0 Security Protection: Block direct origin bypass.
    # Requests MUST come through Cloudflare Zero Trust (possessing CF-Ray header) or local loopback.
    set $block_origin 0;
    if ($http_cf_ray = "") {
        set $block_origin 1;
    }
    if ($remote_addr = "127.0.0.1") {
        set $block_origin 0;
    }
    if ($block_origin = 1) {
        return 403 "Direct origin access forbidden. Please access via Cloudflare Zero Trust protected domain: https://mlflow.example.com\n";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 86400s;
    }
}
